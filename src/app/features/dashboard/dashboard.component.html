<div class="dashboard-page">
  <header class="dashboard-header">
    <div class="brand">
      <span class="brand-name">FWnet</span>
      <span class="brand-description">Time Tracking</span>
    </div>

    <button
      class="logout-button"
      type="button"
      (click)="logout()"
    >
      Sair
    </button>
  </header>

  <main class="dashboard-content">
    <section class="welcome-card" aria-labelledby="dashboard-title">
      <p class="section-label">PAINEL PRINCIPAL</p>

      <h1 id="dashboard-title">Bem-vindo ao FWnet Time Tracking</h1>

      <p class="welcome-description">
        Este é o seu espaço para acompanhar sua jornada de trabalho.
      </p>
    </section>

    <app-time-record></app-time-record>
  </main>
</div>
